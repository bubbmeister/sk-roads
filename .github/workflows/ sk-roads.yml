name: Update SK road conditions

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes (UTC)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sk-roads
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Random delay
        run: sleep $((RANDOM % 1200))
        
      - name: Scrape road conditions
        run: node scrape-sk-roads.mjs

      - name: Commit if the data changed
        run: |
          git config user.name "road-conditions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sk-roads.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update SK road conditions"
            git push
          fi
